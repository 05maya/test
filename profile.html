<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1000px;height:1000px;background:#0a0a0a;font-family:'Noto Sans KR',sans-serif;color:#e9d9a6;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1d1a12 0%,#0a0a0a 70%)}
.ring{position:absolute;inset:40px;border:3px solid #c9a24a;border-radius:50%}
.ring2{position:absolute;inset:58px;border:1px solid #8a6d2b;border-radius:50%}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.en{font-size:24px;letter-spacing:10px;color:#c9a24a;margin-bottom:22px}
.t1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:112px;line-height:1.05;
background:linear-gradient(180deg,#f7e7a8,#c9a24a 55%,#8a6d2b);-webkit-background-clip:text;color:transparent}
.t2{font-family:'Noto Serif KR',serif;font-weight:700;font-size:56px;color:#f1dfa0;margin-top:6px;letter-spacing:6px}
.line{width:300px;height:2px;background:linear-gradient(90deg,transparent,#c9a24a,transparent);margin:30px 0 26px}
.item{font-size:36px;font-weight:500;color:#f3e6bb;line-height:1.75}
.item b{color:#c9a24a;margin-right:12px;font-size:26px}
.foot{margin-top:24px;font-size:26px;color:#c9a24a;letter-spacing:4px}
</style></head><body>
<div class="bg"></div><div class="ring"></div><div class="ring2"></div>
<div class="wrap">
<div class="en">ANNUAL CONSULTING</div>
<div class="t1">연간 고교</div>
<div class="t1">컨설팅</div>
<div class="line"></div>
<div class="item"><b>◆</b>생기부 관리</div>
<div class="item"><b>◆</b>보고서 주제 관리</div>
<div class="item"><b>◆</b>진로 · 입시 로드맵</div>
<div class="foot">1:1 맞춤 컨설팅</div>
</div></body></html>
