    const STAGES = ["STAGE 1. 기초 다지기", "STAGE 2. 핵심 기술 익히기", "STAGE 3. 현장 적용", "STAGE 4. 심화 · 통합"];

      { id: "beginner", label: "입문 (쉬운 책 위주)" },
      { id: "normal", label: "보통 (골고루)" },

    /* ------------------------------------------------------------------
     * 2. 로드맵 생성 로직
     * ------------------------------------------------------------------ */
    function matchTopics(text) {
      const t = (text || "").toLowerCase();
      return TOPICS
        .map(tp => ({ id: tp.id, score: tp.keywords.filter(k => t.includes(k)).length }))
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .map(x => x.id);
    }

    function toPlanBook(key) {
      const b = BOOKS[key];
      return { id: key, title: b.title, author: b.author, core: b.core, mission: b.mission };
    }

    function generatePlan(p) {
      const need = p.weeks * p.perWeek;
      const lists = p.topics.map(id => TOPICS.find(t => t.id === id).books);
      const maxLen = Math.max(0, ...lists.map(l => l.length));
      const seen = new Set();
      const pool = [];
      for (let i = 0; i < maxLen; i++) {
        lists.forEach(l => {
          if (l[i] && !seen.has(l[i])) { seen.add(l[i]); pool.push(l[i]); }
        });
      }
      const fits = k => p.audience === "student" ? BOOKS[k].d <= 2 : p.level === "beginner" ? BOOKS[k].d <= 2 : p.level === "advanced" ? BOOKS[k].d >= 2 : true;
      const preferred = pool.filter(fits);
      const rest = pool.filter(k => !fits(k));
      const picked = [...preferred, ...rest].slice(0, need).sort((a, b) => BOOKS[a].d - BOOKS[b].d);

      const ctx = p.context.trim();
      // 책이 부족하면 모든 주에 고르게 분배 (예: 16권/12주 → 앞 4주는 2권, 나머지 1권)
      const base = Math.floor(picked.length / p.weeks);
      const extra = picked.length % p.weeks;
      let cursor = 0;
      return Array.from({ length: p.weeks }, (_, w) => {
        const cnt = base + (w < extra ? 1 : 0);
        const books = picked.slice(cursor, cursor + cnt).map(toPlanBook);
        cursor += cnt;
        return {
          week: w + 1,
          stage: STAGES[Math.min(3, Math.floor((w * 4) / p.weeks))],
          books,
          coreAbility: books.map(b => b.core).join(" + "),
          mission: books.map(b => b.mission).join(" / ") + (books.length && ctx ? ` (적용 현장: ${ctx})` : "")
        };
      });
    }

              <select className={inputCls} value={profile.perWeek} onChange={e => set("perWeek", Number(e.target.value))}>
                {[1, 2, 3].map(n => <option key={n} value={n}>{n}권</option>)}
              </select>
            </Field>
            <Field label="하루 독서(분)">
              <select className={inputCls} value={profile.dailyMin} onChange={e => set("dailyMin", Number(e.target.value))}>
                {[15, 30, 45, 60, 90].map(n => <option key={n} value={n}>{n}분</option>)}
              </select>
            </Field>
            <Field label="난이도">
              <select className={inputCls} value={profile.level} onChange={e => set("level", e.target.value)}>
                {LEVELS.map(l => <option key={l.id} value={l.id}>{l.label}</option>)}
              </select>
            </Field>
          </div>

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2 border-t border-slate-100">
            <span className="text-xs text-slate-500">총 {total}권 · 하루 {profile.dailyMin}분 기준으로 설계됩니다.</span>
            <button
              onClick={() => {
                if (hasPlan && !confirm("새 로드맵을 만들면 현재 로드맵이 교체됩니다. (워크시트·복기 기록은 유지) 계속할까요?")) return;
                onGenerate();
              }}
              className="px-5 py-2.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700">
              {hasPlan ? "로드맵 다시 설계하기" : "로드맵 설계하기 →"}
            </button>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------
     * 6. 탭 2: 로드맵 (+ 편집)
     * ------------------------------------------------------------------ */
    function RoadmapTab({ profile, plan, setPlan, completedWeeks, toggleWeek, goDesign }) {
      const [editing, setEditing] = useState(false);
      const [custom, setCustom] = useState({});

      if (!plan.length) {
        return (
          <div className="p-8 bg-white rounded-xl border border-dashed border-slate-300 text-center text-sm text-slate-500">
            아직 로드맵이 없어요.{" "}
            <button className="text-indigo-600 font-bold underline" onClick={goDesign}>설계 탭</button>에서 관심분야를 입력해보세요.
          </div>
        );
      }

      const usedIds = new Set(plan.flatMap(w => w.books.map(b => b.id)));
      const candidates = Array.from(new Set(
        (profile.topics.length ? profile.topics : TOPICS.map(t => t.id))
          .flatMap(id => TOPICS.find(t => t.id === id).books)
      )).filter(k => !usedIds.has(k));

      const updateWeek = (wNum, fn) => setPlan(plan.map(w => w.week === wNum ? fn(w) : w));
      const removeBook = (wNum, id) => updateWeek(wNum, w => ({ ...w, books: w.books.filter(b => b.id !== id) }));
      const addCatalog = (wNum, key) => {
        if (!key) return;
        const b = toPlanBook(key);
        updateWeek(wNum, w => ({
          ...w,
          books: [...w.books, b],
          coreAbility: w.coreAbility ? w.coreAbility + " + " + b.core : b.core,
          mission: w.mission ? w.mission + " / " + b.mission : b.mission
        }));
      };
      const addCustom = wNum => {
        const c = custom[wNum] || {};
        if (!(c.title || "").trim()) return;
        const b = { id: "c-" + Date.now(), title: c.title.trim(), author: (c.author || "").trim() || "저자 미상", core: "", mission: "" };
        updateWeek(wNum, w => ({ ...w, books: [...w.books, b] }));
        setCustom(prev => ({ ...prev, [wNum]: { title: "", author: "" } }));
      };

      const copyPlan = () => {
        const lines = [
          `📚 ${profile.name ? profile.name + "님의 " : ""}${plan.length}주 독서 로드맵`,
          profile.goal && `목표: ${profile.goal}`,
          ""
        ].filter(x => x !== false && x !== undefined);
        plan.forEach(w => {
          lines.push(`[Week ${w.week}] ${w.stage}`);
          w.books.forEach(b => lines.push(`  - ${b.title} (${b.author})`));
          if (w.coreAbility) lines.push(`  핵심 역량: ${w.coreAbility}`);
          if (w.mission) lines.push(`  실전 미션: ${w.mission}`);
          lines.push("");
        });
        const text = lines.join("\n");
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert("로드맵이 복사되었습니다."), () => prompt("복사해서 사용하세요", text));
        else prompt("복사해서 사용하세요", text);
      };

      let lastStage = "";
      return (
        <div className="space-y-4">
          <div className="p-4 bg-amber-50 rounded-lg border border-amber-200 text-xs text-amber-800 leading-relaxed">
            <strong>📌 주간 루틴 가이드:</strong> 월~목 하루 {profile.dailyMin}분 독서 & 1-1-1 추출 → 금~토 {profile.context || "실제 현장"}에 실전 투입 → 일요일 복기 & 차주 계획 수립
          </div>

          <div className="flex justify-end gap-2">
            <button onClick={copyPlan} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-300 bg-white hover:bg-slate-50">📋 로드맵 복사</button>
            <button onClick={() => setEditing(!editing)}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${editing ? "bg-indigo-600 text-white border-indigo-600" : "bg-white border-slate-300 hover:bg-slate-50"}`}>
              {editing ? "✓ 편집 완료" : "✏️ 로드맵 편집"}
            </button>
          </div>

          <div className="grid gap-4">
            {plan.map(item => {
              const isDone = !!completedWeeks[item.week];
              const showStage = item.stage !== lastStage;
              lastStage = item.stage;
              const c = custom[item.week] || { title: "", author: "" };
              return (
                <React.Fragment key={item.week}>
                  {showStage && <div className="text-xs font-bold text-slate-400 mt-2 px-1">{item.stage}</div>}
                  <div className={`p-5 rounded-xl border transition-all ${isDone ? "bg-slate-50 border-emerald-300 opacity-90" : "bg-white border-slate-200 shadow-sm"}`}>
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex-1 min-w-0">
                        <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">Week {String(item.week).padStart(2, "0")}</span>

                        <div className="mt-2 space-y-1">
                          {item.books.length === 0 && <div className="text-xs text-slate-400">이 주에 읽을 책을 추가하세요.</div>}
                          {item.books.map(b => (
                            <div key={b.id} className="flex items-center justify-between gap-2">
                              <div className="text-sm font-bold text-slate-900 break-keep">
                                {b.title} <span className="text-xs font-normal text-slate-500">· {b.author}</span>
                                <BookLinks title={b.title} />
                              </div>
                              {editing && <button onClick={() => removeBook(item.week, b.id)} className="text-xs text-rose-600 hover:underline shrink-0">삭제</button>}
                            </div>
                          ))}
                        </div>

                        {editing ? (
                          <div className="mt-3 space-y-2">
                            <Field label="핵심 역량">
                              <input className={inputCls} value={item.coreAbility} onChange={e => updateWeek(item.week, w => ({ ...w, coreAbility: e.target.value }))} />
                            </Field>
                            <Field label="실전 미션">
                              <textarea rows={2} className={inputCls} value={item.mission} onChange={e => updateWeek(item.week, w => ({ ...w, mission: e.target.value }))} />
                            </Field>
                            <div className="flex flex-wrap gap-2 items-center pt-1">
                              <select className="text-xs p-2 border border-slate-200 rounded-lg max-w-full" value="" onChange={e => addCatalog(item.week, e.target.value)}>
                                <option value="">+ 추천 도서에서 추가</option>
                                {candidates.map(k => <option key={k} value={k}>{BOOKS[k].title}</option>)}
                              </select>
                              <input className="text-xs p-2 border border-slate-200 rounded-lg w-36" placeholder="직접 입력: 책 제목" value={c.title}
                                onChange={e => setCustom(prev => ({ ...prev, [item.week]: { ...c, title: e.target.value } }))} />
                              <input className="text-xs p-2 border border-slate-200 rounded-lg w-28" placeholder="저자" value={c.author}
                                onChange={e => setCustom(prev => ({ ...prev, [item.week]: { ...c, author: e.target.value } }))} />
                              <button onClick={() => addCustom(item.week)} className="text-xs px-3 py-2 rounded-lg bg-slate-800 text-white font-semibold">추가</button>
                            </div>
                          </div>
                        ) : (
                          <div className="mt-2 text-xs text-slate-600 space-y-1">
                            {item.coreAbility && <div><strong className="text-slate-700">핵심 역량:</strong> {item.coreAbility}</div>}
                            {item.mission && <div><strong className="text-slate-700">실전 미션:</strong> {item.mission}</div>}
                          </div>
                        )}
                      </div>

                      <button onClick={() => toggleWeek(item.week)}
                        className={`shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-colors ${
                          isDone ? "bg-emerald-600 text-white border-emerald-600 hover:bg-emerald-700" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50"}`}>
                        {isDone ? "완주 완료 ✓" : "완주 체크"}
                      </button>
                    </div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------
     * 7. 탭 3: 1-1-1 워크시트
     * ------------------------------------------------------------------ */
    function WorksheetTab({ plan, worksheets, setWorksheets, goDesign }) {
      const allBooks = plan.flatMap(w => w.books.map(b => ({ ...b, week: w.week, stage: w.stage })));
      const [selId, setSelId] = useState(null);

      if (!allBooks.length) {
        return (
          <div className="p-8 bg-white rounded-xl border border-dashed border-slate-300 text-center text-sm text-slate-500">
            워크시트에 표시할 책이 없어요. <button className="text-indigo-600 font-bold underline" onClick={goDesign}>설계 탭</button>에서 로드맵을 만들거나 로드맵에 책을 추가하세요.
          </div>
        );
      }

      const book = allBooks.find(b => b.id === selId) || allBooks[0];
      const data = worksheets[book.id] || {};
      const change = (field, val) => setWorksheets(prev => ({ ...prev, [book.id]: { ...prev[book.id], [field]: val } }));

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="space-y-1 md:max-h-[700px] overflow-y-auto pr-1">
            <span className="text-xs font-semibold text-slate-400 px-2 block mb-2">도서 목록 (총 {allBooks.length}권)</span>
            {allBooks.map((b, i) => {
              const has = worksheets[b.id]?.sentence || worksheets[b.id]?.skill || worksheets[b.id]?.experiment;
              const active = book.id === b.id;
              return (
                <button key={b.id} onClick={() => setSelId(b.id)}
                  className={`w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium transition flex items-center justify-between ${
                    active ? "bg-indigo-600 text-white shadow-sm" : "bg-white hover:bg-slate-100 text-slate-700 border border-slate-200"}`}>
                  <span className="truncate pr-2">{String(i + 1).padStart(2, "0")}. {b.title}</span>
                  {has && <span className={`text-[10px] px-1.5 py-0.5 rounded font-normal ${active ? "bg-indigo-700 text-indigo-100" : "bg-emerald-100 text-emerald-700"}`}>작성됨</span>}
                </button>
              );
            })}
          </div>

          <div className="md:col-span-2 bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
            <div className="border-b border-slate-100 pb-4 mb-4">
              <span className="text-xs font-medium text-indigo-600">{book.stage} (Week {book.week})</span>
              <h2 className="text-xl font-bold mt-1">{book.title}</h2>
              <p className="text-xs text-slate-500 mt-0.5">저자: {book.author} <BookLinks title={book.title} /></p>
              {book.core && <p className="text-xs text-slate-500 mt-1">읽을 때의 초점: {book.core}</p>}
            </div>
            <div className="space-y-5">
              <Field label="1. 1문장 (Core)" hint="이 책이 말하는 가장 핵심적인 원리는?">
                <textarea rows={3} className={inputCls} value={data.sentence || ""} onChange={e => change("sentence", e.target.value)} placeholder="핵심 통찰을 1문장으로 요약해보세요." />
              </Field>
              <Field label="2. 1기술 (Skill)" hint="현장에서 즉시 쓸 수 있는 기술은?">
                <textarea rows={3} className={inputCls} value={data.skill || ""} onChange={e => change("skill", e.target.value)} placeholder="구체적인 대화 템플릿, 행동 규칙, 체크리스트 등을 적어보세요." />
              </Field>
              <Field label="3. 1실험 (Experiment)" hint="누구에게 어떤 상황에서 적용하고 결과는?">
                <textarea rows={4} className={inputCls} value={data.experiment || ""} onChange={e => change("experiment", e.target.value)}
                  placeholder={"[계획] 이번 주 ○○ 상황에서 ○○ 기술 적용\n[결과] 상대의 반응 / 내가 느낀 점"} />
              </Field>
              <div className="pt-2 text-right"><span className="text-[11px] text-emerald-600 font-medium">✓ 입력 시 브라우저에 자동 저장됩니다.</span></div>
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------
     * 8. 탭 4: 주간 복기
     * ------------------------------------------------------------------ */
    function ReviewTab({ plan, reviews, setReviews, completedWeeks, toggleWeek, goDesign }) {
      const [wk, setWk] = useState(1);
      if (!plan.length) {
        return (
          <div className="p-8 bg-white rounded-xl border border-dashed border-slate-300 text-center text-sm text-slate-500">
            <button className="text-indigo-600 font-bold underline" onClick={goDesign}>설계 탭</button>에서 로드맵을 먼저 만들어주세요.
          </div>
        );
      }
      const cur = reviews[wk] || {};
      const change = (field, val) => setReviews(prev => ({ ...prev, [wk]: { ...prev[wk], [field]: val } }));
      const QS = [
        ["q1", "질문 1. 이번 주에 직접 적용한 핵심 기술은 무엇이며, 상대방의 반응은 어떠했는가?", "실제 상황에서 사용한 구체적 반응을 기록하세요."],
        ["q2", "질문 2. 예상과 달랐던 지점은 무엇이며, 내 방식에서 보완할 점은 무엇인가?", "돌발 상황이나 놓친 신호를 복기해보세요."],
        ["q3", "질문 3. 다음 주에 어떤 상황에서 더 정교하게 적용해 볼 것인가?", "구체적 인물과 목표 상황을 설정하세요."]
      ];
      return (
        <div className="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-3">
            <div>
              <h2 className="text-lg font-bold">🔄 일요일 주간 복기 및 성장 저널</h2>
              <p className="text-xs text-slate-500 mt-0.5">한 주의 실험을 돌아보고 다음 주 적용점을 정의합니다.</p>
            </div>
            <div className="flex items-center gap-2">
              <label className="text-xs font-bold text-slate-700">주차 선택:</label>
              <select value={wk} onChange={e => setWk(Number(e.target.value))} className="text-xs font-semibold p-2 border border-slate-300 rounded-lg bg-slate-50">
                {plan.map(w => <option key={w.week} value={w.week}>Week {String(w.week).padStart(2, "0")}</option>)}
              </select>
            </div>
          </div>
          <div className="space-y-6 mt-6">
            {QS.map(([k, label, ph]) => (
              <Field key={k} label={label}>
                <textarea rows={3} className={inputCls} value={cur[k] || ""} onChange={e => change(k, e.target.value)} placeholder={ph} />
              </Field>
            ))}
            <div className="flex justify-between items-center pt-2">
              <span className="text-[11px] text-emerald-600 font-medium">✓ 입력 시 브라우저에 자동 저장됩니다.</span>
              <button onClick={() => toggleWeek(wk)}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition ${completedWeeks[wk] ? "bg-slate-200 text-slate-700 hover:bg-slate-300" : "bg-indigo-600 text-white hover:bg-indigo-700"}`}>
                {completedWeeks[wk] ? "완주 취소하기" : `Week ${wk} 완주 체크하기`}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------
     * 9. App
     * ------------------------------------------------------------------ */
    function App() {
      const saved = React.useMemo(loadStore, []);
      const [profile, setProfile] = useState({ ...DEFAULT_PROFILE, ...(saved.profile || {}) });
      const [plan, setPlan] = useState(saved.plan || []);
      const [completedWeeks, setCompletedWeeks] = useState(saved.completedWeeks || {});
      const [worksheets, setWorksheets] = useState(saved.worksheets || {});
      const [reviews, setReviews] = useState(saved.reviews || {});
      const [tab, setTab] = useState((saved.plan || []).length ? "roadmap" : "design");

      useEffect(() => {
        saveStore({ profile, plan, completedWeeks, worksheets, reviews });
      }, [profile, plan, completedWeeks, worksheets, reviews]);

      const toggleWeek = w => setCompletedWeeks(prev => ({ ...prev, [w]: !prev[w] }));

      const onGenerate = () => {
        setPlan(generatePlan(profile));
        setCompletedWeeks({});
        setTab("roadmap");
      };

      const resetAll = () => {
        if (!confirm("프로필, 로드맵, 워크시트, 복기 기록을 모두 삭제하고 처음부터 시작할까요?")) return;
        setProfile({ ...DEFAULT_PROFILE });
        setPlan([]); setCompletedWeeks({}); setWorksheets({}); setReviews({});
        setTab("design");
      };

      const total = plan.length;
      const done = plan.filter(w => completedWeeks[w.week]).length;
      const percent = total ? Math.round((done / total) * 100) : 0;
      const bookCount = plan.reduce((n, w) => n + w.books.length, 0);

      const TABS = [["design", "① 관심분야 설계"], ["roadmap", "② 마스터 로드맵"], ["worksheet", "③ 1-1-1 워크시트"], ["review", "④ 주간 복기"]];

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          <header className="mb-8">
            <div className="flex items-start justify-between gap-3">
              <div>
                <span className="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-100 text-indigo-700">맞춤형 실행 독서 로드맵</span>
                <h1 className="text-2xl sm:text-3xl font-bold mt-2">
                  {profile.name ? `${profile.name}님의 독서 설계 워크북` : "맞춤 독서 설계 워크북"}
                </h1>
                <p className="text-sm text-slate-500 mt-1">
                  {profile.goal ? `"${profile.goal}"` : "관심분야를 입력하면 읽기 → 기술 추출 → 현장 실험 → 복기 사이클이 설계됩니다."}
                </p>
              </div>
              <button onClick={resetAll} className="text-xs text-slate-400 hover:text-rose-600 shrink-0 underline">초기화</button>
            </div>

            {total > 0 && (
              <div className="mt-5 p-4 bg-white rounded-xl shadow-sm border border-slate-200">
                <div className="flex justify-between items-center text-sm font-medium mb-2">
                  <span className="text-slate-700">{total}주 완주 달성률 <span className="text-xs text-slate-400">· 총 {bookCount}권</span></span>
                  <span className="text-indigo-600 font-bold">{done} / {total}주 ({percent}%)</span>
                </div>
                <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                  <div className="bg-indigo-600 h-3 rounded-full transition-all duration-300" style={{ width: `${percent}%` }}></div>
                </div>
              </div>
            )}

            <div className="flex border-b border-slate-200 mt-6 gap-1 overflow-x-auto">
              {TABS.map(([id, label]) => (
                <button key={id} onClick={() => setTab(id)}
                  className={`pb-3 px-3 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${
                    tab === id ? "border-indigo-600 text-indigo-600" : "border-transparent text-slate-500 hover:text-slate-800"}`}>
                  {label}
                </button>
              ))}
            </div>
          </header>

          {tab === "design" && <DesignTab profile={profile} setProfile={setProfile} hasPlan={total > 0} onGenerate={onGenerate} />}
          {tab === "roadmap" && <RoadmapTab profile={profile} plan={plan} setPlan={setPlan} completedWeeks={completedWeeks} toggleWeek={toggleWeek} goDesign={() => setTab("design")} />}
          {tab === "worksheet" && <WorksheetTab plan={plan} worksheets={worksheets} setWorksheets={setWorksheets} goDesign={() => setTab("design")} />}
          {tab === "review" && <ReviewTab plan={plan} reviews={reviews} setReviews={setReviews} completedWeeks={completedWeeks} toggleWeek={toggleWeek} goDesign={() => setTab("design")} />}

          <footer className="mt-10 text-[11px] text-slate-400 text-center">
            추천 도서는 국내 서점(교보문고·YES24·알라딘)에서 유통되는 책으로 구성했으며, 책 옆 링크로 재고·판매 여부를 확인할 수 있습니다. 로드맵 편집으로 자유롭게 바꿔 쓰세요. 모든 기록은 이 브라우저에만 저장됩니다.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
